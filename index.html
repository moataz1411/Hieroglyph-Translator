<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hieroglyph Translator</title>
    </head>    
    <body>
        
        <div class="name">
            <header>
                
                <h1>Hieroglyph Translator</h1>
                <div class="subtitle">
                    <h2>Translate ur name into Egyptian hieroglyphs</h2>
                </div>
            </header>
            <textarea id="input" placeholder="What do u want to turn into hieroglyphs"></textarea>
            <textarea id="output" placeholder="ur hieroglyphic will appear here"></textarea>
            <div class="buttons">
                <button onclick="translateText()">let's Translate</button>
                <button onclick="copyText()">Copy</button>
                <button onclick="clearText()">Clear</button>
                <button onclick="swapText()">Swap to hieroglyphs</button>
            </div>
            <div class="alphabet">
                <h2>Hieroglyphic Alphabet</h2>
                <img src="./alphabet.png" alt="Hieroglyphic Alphabet">
            </div>
            <footer>Discover the magnificent language of my ancestors | Made by @Mozmezo</footer>
        </div>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap');
            *{
                box-sizing:border-box;
                margin:0;
                padding:0;
            }
            body{
                background: url("./background.jpeg");
                background-size:cover;
                background-position:center;
                background-repeat:no-repeat;
                justify-content:center;
                align-items:center;
                font-family:'Cinzel', sans-serif;
                display:flex;
                color:#060606;
                min-height:100vh;
            }
            header{
                text-align:center;
                margin-bottom:40px;
            }
            .name{
                width:90%;
                max-width:750px;
                padding:40px;
                height: 100%;
                background: rgba(10, 7, 5, 0.9);
                border-radius: 20px;
            }
            h1{
                font-size:45px;
                letter-spacing: 7px;
                color:#e9bd7a;
            }
            h2{
                letter-spacing: 3px;
                color:#bca779;
                font-size:19px;
            }
            textarea{
                display:block;
                color:#fff0c5;
                width:100%;
                border-radius:13px;
                outline:none;
                font-size:20px;
                padding:20px;
                resize:vertical;
                min-height:125px;
                background:#21190d;
                line-height:1.5;
                margin-bottom:20px;
            }
            .buttons{
                display:flex;
                gap:12px;
                margin-top:21px;
                flex-wrap:wrap;
            }
            button{
                flex:1;
                padding:15px;
                font-size:16px;
                cursor:pointer;
                border-radius:13px;
                font-weight:bold;
                background:linear-gradient(135deg, #e9bd7a, #bca779);
                border: none;
                color: #060606;
                min-width: 120px;
                transition:0.3s;
                font-family: 'Cinzel', sans-serif;
            }
            .alphabet{
                margin-top:35px;
                text-align:center;
            }
            .alphabet h2{
                margin-bottom:20px;
                color:#e9bd7a;
                font-size:25px;
                font-family:'Noto Sans Egyptian Hieroglyphs', sans-serif;
            }
            .alphabet img{
                width:100%;
                max-width:600px;
                height:auto;
                border-radius:13px;
            }
            footer{
                text-align:center;
                margin-top:40px;
                font-size:13px;
                color:#806b45;
                font-family: 'Cinzel', sans-serif;
            }

        </style>
        <script>
            const characters = {
                A:"𓄿",
                B:"𓃀",
                C:"𓎡",
                D:"𓂧",
                E:"𓇋",
                F:"𓆑",
                G:"𓎼",
                H:"𓉔",
                I:"𓇋",
                J:"𓆓",
                K:"𓎡",
                L:"𓃭",
                M:"𓅓",
                N:"𓈖",
                O:"𓅱",
                P:"𓊪",
                Q:"𓈎",
                R:"𓂋",
                S:"𓋴",
                T:"𓏏",
                U:"𓅱",
                V:"𓆑",
                W:"𓅱",
                X:"𓐍",
                Y:"𓇌",
                Z:"𓊃"
            };
            const reverseCharacters = Object.fromEntries(Object.entries(characters).map(([key, value]) => [value, key]));

            function beep(frequency=700,duration=100){
                const audio=new AudioContext();
                const oscillator=audio.createOscillator();
                const volume=audio.createGain();
                oscillator.type="sine";
                oscillator.frequency.value=frequency;
                volume.gain.value=0.1;
                oscillator.connect(volume);
                volume.connect(audio.destination);
                oscillator.start();
                oscillator.stop(audio.currentTime+duration/1000);
                oscillator.onended=()=>audio.close();
            }
            function translateText(){
                const text=document.getElementById("input").value.toUpperCase();
                let hieroghlyphic="";
                for(let char of text){
                    if(char===" "){
                        hieroghlyphic+="  ";
                    }else if(char==="\n"){
                        hieroghlyphic+="\n";
                    }else if(reverseCharacters[char]){
                        hieroghlyphic+=reverseCharacters[char];
                    }else if(characters[char])
                    {hieroghlyphic+=characters[char];}
                    else{hieroghlyphic+=char;}
                    
                }
                document.getElementById("output").value= hieroghlyphic || "ur heiroghlyphic will appear here";
                beep(800,120);
            }
            function swapText(){
                const input=document.getElementById("input");
                const output=document.getElementById("output");
                const temp=input.value;
                input.value=output.value;
                output.value=temp;
                const tempPlaceholder=input.placeholder;
                input.placeholder=output.placeholder;
                output.placeholder=tempPlaceholder;
                swapped=!swapped;
            }
            async function copyText(){
                const hieroghlyphic =document.getElementById("output").value;
                if(!hieroghlyphic || hieroghlyphic.includes("ur hieroghlyphic")) return;
                try{
                    await navigator.clipboard.writeText(hieroghlyphic);
                    alert("Copied to clipboard!");
                }
                catch{
                    alert("copy failed");
                }
                beep(1000,120);
            }
                function clearText(){
                document.getElementById("input").value="";
                document.getElementById("output").value="";
                beep(600,120);
                showStatus("Cleared!");
            }
            
        </script>

    </body>
    </html>
